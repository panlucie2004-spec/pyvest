[project]
name = "pyvest"
version = "0.1.0"
description = "Outils de gestion de portefeuille"
readme = "README.md"
authors = [
    { name = "Pan Lucie", email = "panlucie2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0.0",
    "yfinance>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
